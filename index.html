<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-gray-800">Add Product</h1>
            <span class="bg-teal-100 text-teal-800 text-xs font-bold px-2 py-1 rounded">Admin Mode</span>
        </div>

        <form id="addProductForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Product Title</label>
                <input type="text" id="title" required class="mt-1 w-full border border-gray-300 rounded-md p-2" placeholder="e.g. Women's High-Waist Jeans">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Selling Price (₹)</label>
                    <input type="number" id="sellingPrice" required class="mt-1 w-full border border-gray-300 rounded-md p-2" placeholder="899">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">MRP (₹)</label>
                    <input type="number" id="mrp" required class="mt-1 w-full border border-gray-300 rounded-md p-2" placeholder="1299">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Image URL</label>
                <input type="url" id="imageUrl" required class="mt-1 w-full border border-gray-300 rounded-md p-2" placeholder="https://link-to-image.jpg">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Shop Name</label>
                <input type="text" id="shopName" class="mt-1 w-full border border-gray-300 rounded-md p-2" value="WOW COLLECTION PVR CINEMALL">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Sizes / Specs</label>
                <input type="text" id="sizes" class="mt-1 w-full border border-gray-300 rounded-md p-2" value="S, M, L, XL">
            </div>

            <button type="submit" class="w-full bg-teal-600 text-white font-bold py-3 rounded-lg hover:bg-teal-700 mt-4">
                Publish Product to Firestore
            </button>
        </form>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEp2fwJmNajreNUcXqGTY_sYhzWryxAUY",
            authDomain: "fully-ai-website.firebaseapp.com",
            projectId: "fully-ai-website",
            storageBucket: "fully-ai-website.firebasestorage.app",
            messagingSenderId: "494758463985",
            appId: "1:494758463985:web:fce9c3b0a25280ba999c50"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Publishing...';
            btn.disabled = true;

            try {
                // Calculate discount automatically
                const sp = Number(document.getElementById('sellingPrice').value);
                const mrp = Number(document.getElementById('mrp').value);
                const discount = Math.round(((mrp - sp) / mrp) * 100);

                await addDoc(collection(db, "products"), {
                    title: document.getElementById('title').value,
                    sellingPrice: sp,
                    mrp: mrp,
                    discount: discount,
                    imageUrl: document.getElementById('imageUrl').value,
                    shopName: document.getElementById('shopName').value,
                    sizes: document.getElementById('sizes').value,
                    rating: '5.0',
                    reviews: '0',
                    timestamp: new Date()
                });

                alert("Product Published Successfully!");
                e.target.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error: Check console");
            } finally {
                btn.innerHTML = 'Publish Product to Firestore';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
